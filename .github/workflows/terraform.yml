name: Terraform Infrastructure

on:
    push:
        branches:
            - feature/terraform-staging
        paths:
            - "infrastructure/**"
            - ".github/workflows/terraform.yml"
    
    pull_request:
        branches:
            - main
        paths: 
            - "infrastructure/**"
            - ".github/workflows/terraform.yml"

    workflow_dispatch:
        inputs:
            operation:
                description: "Terraform operation"
                required: true
                type: choice
                options:
                    - validate
                    - apply
                default: validate

permissions:
    contents: read

jobs:
    terraform-validate:
        name: Terraform Validate
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: infrastructure

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform Format Check
              run: terraform fmt -check

            - name: Terraform Initialize
              run: terraform init -backend=false

            - name: Terraform Validate
              run: terraform validate

    terraform-plan:
        name: Terraform Plan
        runs-on: ubuntu-latest
        needs: terraform-validate
    
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/terraform-staging'

        environment: terraform-staging-plan

        defaults:
            run:
                working-directory: infrastructure

        env:
            TF_IN_AUTOMATION: "true"
            TF_INPUT: "false"
            TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
            RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
            RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
            TF_VAR_repo_url: "https://github.com/BlueShirt03/task-manager-ci"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3
            
            - name: Configure HCP Terraform credentials
              env:
                HCP_TOKEN: ${{ secrets.TF_API_TOKEN }}
              run: |
                mkdir -p "$HOME/.terraform.d"
                printf '{"credentials":{"app.terraform.io":{"token":"%s"}}}\n' "$HCP_TOKEN" > "$HOME/.terraform.d/credentials.tfrc.json"
                chmod 600 "$HOME/.terraform.d/credentials.tfrc.json"

            - name: Terraform Initialize
              run: terraform init

            - name: Terraform Plan
              run: terraform plan -no-color


    terraform-apply:
        name: Terraform Apply 
        runs-on: ubuntu-latest
        needs: terraform-validate

        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply' && github.ref == 'refs/heads/feature/terraform-staging'

        environment: terraform-staging-apply

        defaults:
            run:
              working-directory: infrastructure

        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          TF_VAR_repo_url: "https://github.com/BlueShirt03/task-manager-ci"

        
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3
            
            - name: Configure HCP Terraform credentials
              env:
                HCP_TOKEN: ${{ secrets.TF_API_TOKEN }}
              run: |
               mkdir -p "$HOME/.terraform.d"
               printf '{"credentials":{"app.terraform.io":{"token":"%s"}}}\n' "$HCP_TOKEN" > "$HOME/.terraform.d/credentials.tfrc.json"
               chmod 600 "$HOME/.terraform.d/credentials.tfrc.json"

            - name: Terraform Initialize
              run: terraform init
            
            - name: Terraform Plan
              run: terraform plan -out=tfplan -no-color

            - name: Terraform Apply
              run: terraform apply -auto-approve -no-color tfplan
