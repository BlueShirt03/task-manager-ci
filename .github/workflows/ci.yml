name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests
        run: python3 -m pytest -v

      - name: Validate Python Compilation
        run: python -m compileall -q app.py

      - name: Package Application
        run: |
          mkdir -p dist 
          zip dist/task-manager.zip app.py requirements.txt

      - name: Upload Build Artifact 
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-artifact
          path: dist/task-manager.zip
          if-no-files-found: error

  deploying-staging:
     needs: build-and-test
     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
     runs-on: ubuntu-latest
     environment: staging

     steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: task-manager-artifact
          path: dist
      
      - name: Validate Downloaded Artifact
        run: |
          unzip -t dist/task-manager.zip

      - name: Deploy Validated Commit to Render
        env:
          RENDER_API_KEY: ${{secrets.RENDER_API_KEY}}
          RENDER_SERVICE_ID: ${{vars.RENDER_SERVICE_ID}}
          COMMIT_SHA: ${{github.sha}}
        run: |
           curl --fail-with-body --show-error --silent \
            --request POST \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"commitId\":\"$COMMIT_SHA\"}" \
            --output deployment.json
      
      - name: Verify Staging Deployment
        env:
          RENDER_API_KEY: ${{secrets.RENDER_API_KEY}}
          RENDER_SERVICE_ID: ${{vars.RENDER_SERVICE_ID}}
          COMMIT_SHA: ${{github.sha}}
        run: |
          DEPLOY_ID=$(python -c "import json; print(json.load(open('deployment.json'))['id'])")

          echo "Monitoring deployment: $DEPLOY_ID"
          echo "Expected commit: $COMMIT_SHA"

          for attempt in {1..60}; do
            curl --fail-with-body --silent --show-error \
              --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --output deployment-status.json

            STATUS=$(python -c "import json; print(json.load(open('deployment-status.json'))['status'])")
            DEPLOYED_COMMIT=$(python -c "import json; print(json.load(open('deployment-status.json'))['commit']['id'])")

            echo "Attempt $attempt: $STATUS"

            if [ "$DEPLOYED_COMMIT" != "$COMMIT_SHA" ]; then
              echo "ERROR: Deployed commit does not match tested commit."
              exit 1
            fi

            if [ "$STATUS" = "live" ]; then
              echo "Staging deployment successful."
              exit 0
            fi

            if [[ "$STATUS" = "deactivated" || "$STATUS" = "build_failed" || "$STATUS" = "update_failed" || "$STATUS" = "canceled" ]]; then
              echo "ERROR: Deployment failed with status $STATUS"
              exit 1
            fi

            sleep 10
          done

          echo "ERROR: Deployment timed out."
          exit 1
          
      - name: Run Staging Smoke Test
        env:
          STAGING_URL: ${{vars.STAGING_URL}}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = os.environ["STAGING_URL"].rstrip("/") + "/"

          for attempt in range(1, 13):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      status = response.status
                      data = json.load(response)

                  if status == 200 and data.get("message") == "Welcome to the Task Manager API":
                      print("Smoke test passed: Staging API is responding correctly.")
                      break

                  print(f"Attempt {attempt}: Unexpected API response.")

              except Exception as error:
                  print(f"Attempt {attempt}: {error}")

              if attempt == 12:
                  raise SystemExit("Smoke test failed after 12 attempts.")

              time.sleep(10)
          PY

     

